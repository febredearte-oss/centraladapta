<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Central de Comunicação — Adapta</title>
<meta content="821caab76251abc9474149ebc1af1202097b9da0ea1f694441601218916f3e8b" name="briefing-source-sha256"/>
<meta content="9f3f1fd27378b7bbe1001aa5c3be98e40fc37d6174cf26eab70d08322a7d5237" name="calendar-source-sha256"/>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&amp;family=Montserrat:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/><style>
:root{
  --green:#1f5d46;
  --green-dark:#173f2f;
  --green-soft:#edf3ef;
  --ink:#17231d;
  --muted:#68716b;
  --line:#dde3df;
  --paper:#fff;
  --bg:#f5f6f3;
  --soft:#fafbf9;
  --warning:#996318;
  --warning-soft:#fff4dc;
  --danger:#914343;
  --blue:#3f718d;
  --purple:#73558d;
  --shadow:0 20px 60px rgba(18,43,31,.16);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.5;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:2px solid rgba(31,93,70,.34);
  outline-offset:2px;
}
[hidden]{display:none!important}
.sr-only{
  position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
  margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
  white-space:nowrap!important;border:0!important;
}
/* Estrutura plana */
.shell-header{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  align-items:center;
  gap:20px;
  min-height:64px;
  padding:0 22px;
  border-bottom:1px solid var(--line);
  background:rgba(245,246,243,.96);
  backdrop-filter:blur(12px);
}
.brand{
  display:flex;
  align-items:center;
  gap:9px;
  flex:none;
}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  display:grid;place-items:center;
  background:var(--green);color:#fff;font-weight:900;
}
.brand strong{font-size:12px}
.main-nav{
  display:flex;
  align-self:stretch;
  gap:17px;
  overflow-x:auto;
  scrollbar-width:none;
}
.main-nav::-webkit-scrollbar{display:none}
.main-nav button{
  position:relative;
  flex:none;
  border:0;
  padding:0 1px;
  background:transparent;
  color:var(--muted);
  font-size:11px;
  font-weight:750;
  white-space:nowrap;
}
.main-nav button.active{color:var(--green)}
.main-nav button.active::after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:0;
  height:2px;
  background:var(--green);
}
.header-spacer{flex:1}
.user-select{
  flex:none;
  padding:8px 27px 8px 9px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;color:var(--ink);font-size:10px;
}
.shell-main{
  width:min(1440px,100%);
  margin:0 auto;
  padding:22px 22px 44px;
}
.page{display:none}
.page.active{display:block}
.page-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:18px;
  margin-bottom:16px;
}
.page-head h1,.page-head h2{margin:0;font-size:25px;line-height:1.08}
.page-head p{max-width:760px;margin:6px 0 0;color:var(--muted);font-size:11px}
.eyebrow{
  display:block;
  margin-bottom:5px;
  color:var(--green);
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
}
.primary-button,.secondary-button,.danger-button{
  min-height:36px;
  padding:0 12px;
  border-radius:8px;
  font-size:10px;
  font-weight:800;
}
.primary-button{border:0;background:var(--green);color:#fff}
.secondary-button{border:1px solid var(--line);background:#fff;color:var(--green)}
.danger-button{border:1px solid #e2caca;background:#fff;color:var(--danger)}
/* Visão geral */
.routine-focus{
  padding:17px;
  border:1px solid rgba(31,93,70,.18);
  border-radius:14px;
  background:linear-gradient(135deg,#fff 0%,#edf4ef 100%);
}
.routine-focus-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}
.routine-focus h3{margin:5px 0 4px;font-size:18px}
.routine-focus p{margin:0;color:var(--muted);font-size:10px}
.meters{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:9px;
  margin:11px 0;
}
.meter{
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
}
.meter span{color:var(--muted);font-size:10px}
.meter strong{display:block;margin-top:7px;font-size:25px;line-height:1}
.meter small{display:block;margin-top:7px;color:var(--muted);font-size:9px}
.dashboard-grid{
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);
  gap:11px;
}
.panel{
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  overflow:hidden;
}
.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:12px;
  padding:14px 15px 12px;
  border-bottom:1px solid var(--line);
}
.panel-head h3{margin:5px 0 0;font-size:14px}
.panel-head>span{color:var(--muted);font-size:9px}
.compact-list{padding:3px 15px 8px}
.compact-row{
  display:grid;
  grid-template-columns:8px minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  padding:11px 0;
  border-bottom:1px solid var(--line);
}
.compact-row:last-child{border-bottom:0}
.dot{width:7px;height:7px;border-radius:50%;background:#8b948e}
.dot.editing{background:var(--blue)}
.dot.scheduled{background:var(--purple)}
.compact-row strong{display:block;font-size:10px}
.compact-row span{display:block;margin-top:3px;color:var(--muted);font-size:9px}
.link-button{
  padding:6px 8px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;color:var(--green);
  font-size:9px;font-weight:750;
}
.history-panel{margin-top:11px}
.empty{padding:24px 12px;color:var(--muted);font-size:10px;text-align:center}
/* Conteúdos */
.contents-top{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:12px;
}
.contents-top h1{margin:0;font-size:25px}
.contents-top p{margin:5px 0 0;color:var(--muted);font-size:11px}
.contents-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.stage-tabs{
  display:flex;
  gap:18px;
  margin-bottom:13px;
  border-bottom:1px solid var(--line);
  overflow-x:auto;
  scrollbar-width:none;
}
.stage-tabs::-webkit-scrollbar{display:none}
.stage-tabs button{
  position:relative;
  flex:none;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:0 1px 10px;
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:11px;
  font-weight:750;
  white-space:nowrap;
}
.stage-tabs button.active{color:var(--green)}
.stage-tabs button.active::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--green);
}
.stage-tabs b{
  min-width:20px;
  padding:3px 6px;
  border-radius:999px;
  background:var(--green-soft);
  color:var(--green);
  font-size:9px;line-height:1;text-align:center;
}
.stage-tabs button.active b{background:var(--green);color:#fff}
.content-view{display:none}
.content-view.active{display:block}
.control-bar{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:43px;
  margin-bottom:9px;
  padding:8px 10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  flex-wrap:wrap;
}
.control-bar label{
  display:flex;
  align-items:center;
  gap:7px;
  margin-right:auto;
  color:var(--muted);
  font-size:10px;
  cursor:pointer;
}
.control-bar input[type="checkbox"]{width:16px;height:16px;accent-color:var(--green)}
.selection-count{color:var(--muted);font-size:9px}
.control-select{
  min-height:31px;
  padding:0 28px 0 9px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;color:var(--ink);font-size:9px;
}
.control-apply{
  min-height:31px;
  padding:0 9px;
  border:0;
  border-radius:7px;
  background:var(--green);
  color:#fff;font-size:9px;font-weight:800;
}
.base-filters{
  display:flex;
  gap:6px;
  margin-bottom:9px;
  flex-wrap:wrap;
}
.base-filters button{
  min-height:31px;
  padding:0 10px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;color:var(--muted);
  font-size:9px;font-weight:750;
}
.base-filters button.active{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.idea-list,.workflow-list,.published-list{display:grid;gap:7px}
.idea-item{
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  overflow:hidden;
}
.idea-summary{
  display:grid;
  grid-template-columns:25px 38px minmax(220px,1fr) 150px 28px;
  gap:9px;
  align-items:center;
  min-height:56px;
  padding:10px 12px;
}
.row-check{display:grid;place-items:center;cursor:pointer}
.row-check input{width:16px;height:16px;accent-color:var(--green)}
.post-number{font-size:10px;font-weight:800;color:var(--green);letter-spacing:.06em}
.title-button{
  min-width:0;
  border:0;
  padding:0;
  background:transparent;
  color:var(--ink);
  text-align:left;
}
.title-button strong{
  display:block;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:12px;
}
.title-button span{display:block;margin-top:3px;color:var(--muted);font-size:9px}
.stage-select{
  width:100%;
  min-height:32px;
  padding:0 28px 0 9px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;color:var(--ink);
  font-size:9px;font-weight:750;
}
.expand-button{
  width:28px;height:28px;
  border:0;background:transparent;
  color:var(--muted);font-size:16px;
}
.idea-item.open .expand-button{transform:rotate(180deg)}
.idea-body{
  display:none;
  padding:14px 15px 17px 62px;
  border-top:1px solid var(--line);
  background:var(--soft);
}
.idea-item.open .idea-body{display:block}
/* Briefing */
.post-body{display:block}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.tag{font-size:10px;background:var(--green-soft);border:1px solid var(--line);border-radius:999px;padding:4px 8px}
.block{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.block:first-of-type{border-top:0;padding-top:0}
.block h3{
  font-size:10px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);margin:0 0 7px;
}
.block p{margin:0 0 9px;font-size:11px;line-height:1.55}
.cards{display:grid;gap:7px}
.card,.caption{
  background:#fff;
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px;
  font-size:10px;
}
.card b{display:block;font-size:9px;color:var(--muted);margin-bottom:4px}
.caption{white-space:pre-line}
/* Listas de produção */
.workflow-row{
  display:grid;
  grid-template-columns:25px minmax(230px,1fr) minmax(140px,.45fr) 150px auto;
  gap:10px;
  align-items:center;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
}
.workflow-meta{color:var(--muted);font-size:9px;line-height:1.45}
.warning{
  display:inline-flex;
  margin-top:3px;
  padding:4px 6px;
  border-radius:6px;
  background:var(--warning-soft);
  color:var(--warning);
  font-size:9px;font-weight:750;
}
.details-button{
  min-height:31px;
  padding:0 8px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;color:var(--green);
  font-size:9px;font-weight:750;
}
.published-row{
  display:grid;
  grid-template-columns:minmax(260px,1fr) 105px 150px auto;
  gap:11px;
  align-items:center;
  padding:12px 13px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
}
.published-row h3{margin:0;font-size:11px}
.published-row p{margin:4px 0 0;color:var(--muted);font-size:9px}
.published-date{font-size:10px;font-weight:750}
.published-file a{color:var(--green);font-size:9px;font-weight:750;text-decoration:none}
.missing{color:var(--warning);font-size:9px;font-weight:750}
/* Calendário — FullCalendar oficial */
.calendar-progress{
  display:grid;
  grid-template-columns:minmax(220px,1fr) auto;
  gap:12px;
  align-items:center;
  margin-bottom:12px;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
}
.progress-copy strong{display:block;font-size:12px}
.progress-copy span{display:block;margin-top:3px;color:var(--muted);font-size:9px}
.progress-track{
  height:8px;
  margin-top:8px;
  border-radius:999px;
  background:#e9ede9;
  overflow:hidden;
}
.progress-fill{height:100%;width:0;background:var(--green);border-radius:inherit}
.progress-percent{font-size:23px;font-weight:850;color:var(--green)}
.calendar-shell{
  display:grid;
  grid-template-columns:minmax(0,1fr) 286px;
  gap:14px;
  align-items:start;
}
.calendar-workspace{
  min-width:0;
  padding:12px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
}
.calendar-loading{
  display:grid;
  place-items:center;
  min-height:420px;
  color:var(--muted);
  font-size:11px;
  text-align:center;
}
.calendar-loading.error{
  padding:30px;
  border:1px dashed #d7bcae;
  border-radius:10px;
  background:#fff8f5;
  color:#8a4e37;
}
.calendar-sidebar{
  position:sticky;
  top:78px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
}
.calendar-sidebar h3{margin:5px 0 4px;font-size:15px}
.calendar-sidebar p{margin:0 0 10px;color:var(--muted);font-size:9px}
.unscheduled-search{
  width:100%;
  height:35px;
  margin-bottom:8px;
  padding:0 9px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  font-size:10px;
}
.unscheduled-list{
  display:grid;
  gap:6px;
  max-height:60vh;
  overflow:auto;
  padding:3px;
}
.unscheduled-card{
  padding:9px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--soft);
  cursor:grab;
  touch-action:none;
}
.unscheduled-card:hover{
  border-color:#bcc9c0;
  background:#fff;
}
.unscheduled-card strong{
  display:block;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:10px;
}
.unscheduled-card span{display:block;margin-top:3px;color:var(--muted);font-size:8px}
.unscheduled-card button{
  margin-top:7px;
  padding:5px 7px;
  border:1px solid var(--line);
  border-radius:6px;
  background:#fff;
  color:var(--green);
  font-size:8px;
  font-weight:750;
}
/* Ajustes de integração com o componente, sem reconstruir a grade */
#fullCalendar{
  min-height:620px;
  --fc-border-color:var(--line);
  --fc-page-bg-color:#fff;
  --fc-neutral-bg-color:var(--soft);
  --fc-today-bg-color:#f0f6f2;
  --fc-event-bg-color:var(--green);
  --fc-event-border-color:var(--green);
  --fc-event-text-color:#fff;
}
#fullCalendar .fc-toolbar{
  gap:10px;
  margin-bottom:14px;
}
#fullCalendar .fc-toolbar-title{
  font-size:18px;
  color:var(--ink);
}
#fullCalendar button{
  font-family:inherit;
  font-size:10px;
}
#fullCalendar .fc-event{
  border-radius:6px;
  font-size:9px;
  cursor:pointer;
}
#fullCalendar .fc-event-main{
  padding:2px 4px;
}
#fullCalendar .adapta-parallel-event{
  opacity:.78;
  border-style:dashed;
}
#fullCalendar .adapta-published-event{
  opacity:.72;
}
#fullCalendar .adapta-preferred-day{
  background:linear-gradient(180deg,#f5faf6 0,#fff 35%);
}
#fullCalendar .adapta-week-full{
  box-shadow:inset 0 0 0 1px rgba(153,99,24,.18);
}
#fullCalendar .adapta-week-over{
  background:#fff8f7;
}
#fullCalendar .fc-daygrid-day-number,
#fullCalendar .fc-col-header-cell-cushion{
  color:var(--ink);
  text-decoration:none;
}
#fullCalendar .fc-list-event-title a{
  color:var(--ink);
  text-decoration:none;
}
#fullCalendar .adapta-line-slot-event{
  background:#1f5d46;
  border-color:#1f5d46;
}
#fullCalendar .adapta-holiday-event{
  background:#a62f2f;
  border-color:#a62f2f;
}
#fullCalendar .adapta-special-event{
  background:#17231d;
  border-color:#17231d;
}
.calendar-source-note{
  margin-top:9px;
  color:var(--muted);
  font-size:8px;
  text-align:right;
}
@media(max-width:980px){
  .calendar-shell{grid-template-columns:1fr}
  .calendar-sidebar{position:static}
}
@media(max-width:760px){
  .calendar-progress{grid-template-columns:1fr auto}
  .calendar-workspace{padding:7px}
  #fullCalendar{min-height:540px}
  #fullCalendar .fc-toolbar{
    align-items:flex-start;
    flex-direction:column;
  }
  #fullCalendar .fc-toolbar-chunk{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
  }
}
/* Linhas editoriais */
.lines-toolbar{
  display:flex;
  align-items:center;
  gap:8px;
}
.lines-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(250px,1fr));
  gap:10px;
}
.line-card{
  display:flex;
  flex-direction:column;
  min-height:220px;
  padding:15px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#fff;
}
.line-card.archived{opacity:.58}
.line-card h3{margin:6px 0 5px;font-size:15px}
.line-card p{margin:0;color:var(--muted);font-size:10px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:11px 0}
.chip{
  display:inline-flex;
  padding:4px 7px;
  border-radius:999px;
  background:var(--green-soft);
  color:var(--green);
  font-size:8px;font-weight:750;
}
.line-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:auto;
}
.line-stat{
  padding:8px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--soft);
}
.line-stat strong{display:block;font-size:15px}
.line-stat span{display:block;margin-top:2px;color:var(--muted);font-size:8px}
.line-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.line-actions button{
  min-height:30px;
  padding:0 8px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;color:var(--green);
  font-size:8px;font-weight:750;
}
/* Futuros módulos */
.placeholder{
  padding:20px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
}
.placeholder h3{margin:0 0 8px;font-size:18px}
.placeholder p{max-width:720px;margin:0;color:var(--muted);font-size:11px}
/* Gavetas únicas */
.overlay{
  position:fixed;
  inset:0;
  z-index:70;
  background:rgba(14,30,22,.25);
  opacity:0;
  pointer-events:none;
  transition:.18s;
}
.drawer{
  position:fixed;
  top:64px;right:0;bottom:0;
  z-index:80;
  width:min(500px,100vw);
  padding:18px;
  overflow:auto;
  background:#fff;
  box-shadow:var(--shadow);
  transform:translateX(104%);
  transition:.2s;
}
body.drawer-open .overlay{opacity:1;pointer-events:auto}
body.drawer-open .drawer.active{transform:translateX(0)}
.drawer-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
