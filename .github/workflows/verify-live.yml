name: Verify Central Adapta Live

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-live.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Dry-run Worker build
        run: |
          mkdir -p live-check
          set +e
          npx wrangler deploy --dry-run > live-check/build.txt 2>&1
          code=$?
          echo "$code" > live-check/build-exit.txt
          exit 0

      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture live calendar
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          import { writeFileSync, readFileSync } from 'node:fs';
          const buildExit=Number(readFileSync('live-check/build-exit.txt','utf8').trim());
          const buildOutput=readFileSync('live-check/build.txt','utf8').slice(-12000);
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
          const pageErrors=[];
          page.on('pageerror', err=>pageErrors.push({name:err.name,message:err.message,stack:String(err.stack||'')}));
          try {
            await page.goto('https://centraladapta.febredearte.workers.dev', { waitUntil: 'networkidle', timeout: 60000 });
            const calendarButton = page.locator('[data-page="calendar"]').first();
            if (await calendarButton.count()) {
              await calendarButton.click();
              await page.waitForTimeout(1800);
            }
            const diagnostics = await page.evaluate(() => {
              const now=new Date();
              const key=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
              const today=document.querySelector('#fullCalendar .adapta-actual-today');
              return {
                browserNow:now.toString(),
                todayKey:key,
                patchStyleV49:!!document.getElementById('calendar-today-ux-v49'),
                patchRuntimeV49:!!document.getElementById('calendar-today-runtime-v49'),
                patchStyleV48:!!document.getElementById('calendar-today-ux-v48'),
                todayFound:!!today,
                todayDate:today?.getAttribute('data-date')||null,
                todayLabel:today?.querySelector('.adapta-today-label')?.textContent?.trim()||null,
                currentCellFound:!!document.querySelector(`#fullCalendar [role="gridcell"][data-date="${key}"]`)
              };
            });
            writeFileSync('live-check/status.json', JSON.stringify({ok:true,runId:process.env.GITHUB_RUN_ID,checkedAt:new Date().toISOString(),buildExit,buildOutput,pageErrors,...diagnostics},null,2));
            await page.screenshot({path:'live-check/calendar-live.png',fullPage:true});
          } catch(e){
            writeFileSync('live-check/status.json',JSON.stringify({ok:false,runId:process.env.GITHUB_RUN_ID,checkedAt:new Date().toISOString(),buildExit,buildOutput,pageErrors,error:String(e.stack||e)},null,2));
            await page.screenshot({path:'live-check/calendar-live.png',fullPage:true}).catch(()=>{});
          } finally { await browser.close(); }
          EOF

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-adapta-live-check
          path: live-check/
          if-no-files-found: warn

      - name: Record diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-check/status.json
          git commit -m "ci: record live calendar verification" || true
          git push
