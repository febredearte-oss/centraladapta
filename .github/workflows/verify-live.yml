name: Verify Central Adapta Live

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-live.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Wait for Cloudflare Git deployment
        run: sleep 30

      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify live Central
        run: |
          mkdir -p live-check
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
          const pageErrors=[];
          page.on('pageerror', err=>pageErrors.push({name:err.name,message:err.message,stack:String(err.stack||'')}));
          let result={ok:false};
          try {
            await page.goto('https://centraladapta.febredearte.workers.dev', { waitUntil: 'networkidle', timeout: 60000 });
            const clock = await page.evaluate(async()=>{
              const r=await fetch('/api/central-clock',{cache:'no-store'});
              return r.ok?await r.json():null;
            });
            const calendarButton = page.locator('[data-page="calendar"]').first();
            if (await calendarButton.count()) {
              await calendarButton.click();
              await page.waitForTimeout(2500);
            }
            const diagnostics = await page.evaluate((officialDate) => {
              const today=document.querySelector('#fullCalendar .adapta-actual-today');
              const nativeToday=[...document.querySelectorAll('#fullCalendar .fc-day-today')].map(el=>el.getAttribute('data-date')).filter(Boolean);
              const wrongNativeToday=nativeToday.filter(date=>date!==officialDate);
              const favicon=[...document.querySelectorAll('link[rel="icon"],link[rel="shortcut icon"]')].map(el=>el.getAttribute('href'));
              return {
                officialDate,
                officialDateWindow:window.__adaptaOfficialDate||null,
                patchStyleV51:!!document.getElementById('calendar-today-ux-v51'),
                patchRuntimeV51:!!document.getElementById('calendar-today-runtime-v51'),
                sharedSyncV3:!!document.getElementById('shared-state-sync-v3'),
                todayFound:!!today,
                todayDate:today?.getAttribute('data-date')||null,
                todayLabel:today?.querySelector('.adapta-today-label')?.textContent?.trim()||null,
                nativeToday,
                wrongNativeToday,
                favicon,
                faviconOk:favicon.some(h=>String(h||'').includes('/brand/adapta-brand-icon-trim.png?v=20260828-2'))
              };
            }, clock?.date||null);
            result={
              ok: pageErrors.length===0 && !!clock?.date && diagnostics.patchStyleV51 && diagnostics.patchRuntimeV51 && diagnostics.sharedSyncV3 && diagnostics.todayFound && diagnostics.todayDate===clock.date && diagnostics.todayLabel==='HOJE' && diagnostics.wrongNativeToday.length===0 && diagnostics.faviconOk,
              runId:process.env.GITHUB_RUN_ID,
              checkedAt:new Date().toISOString(),
              clock,
              pageErrors,
              ...diagnostics
            };
            writeFileSync('live-check/status.json',JSON.stringify(result,null,2));
            await page.screenshot({path:'live-check/calendar-live.png',fullPage:true});
          } catch(e){
            result={ok:false,runId:process.env.GITHUB_RUN_ID,checkedAt:new Date().toISOString(),pageErrors,error:String(e.stack||e)};
            writeFileSync('live-check/status.json',JSON.stringify(result,null,2));
            await page.screenshot({path:'live-check/calendar-live.png',fullPage:true}).catch(()=>{});
          } finally { await browser.close(); }
          if(!result.ok) process.exitCode=1;
          EOF

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-adapta-live-check
          path: live-check/
          if-no-files-found: warn

      - name: Record diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-check/status.json
          git commit -m "ci: record live Central verification" || true
          git push

