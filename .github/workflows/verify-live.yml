name: Verify Central Adapta Live

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-live.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Wait for Cloudflare build
        run: sleep 60

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture live calendar
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          import { writeFileSync, mkdirSync } from 'node:fs';
          mkdirSync('live-check', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
          const pageErrors=[];
          page.on('pageerror', err=>pageErrors.push({name:err.name,message:err.message,stack:String(err.stack||'')}));
          try {
            await page.goto('https://centraladapta.febredearte.workers.dev', { waitUntil: 'networkidle', timeout: 60000 });
            const calendarButton = page.locator('[data-page="calendar"]').first();
            if (await calendarButton.count()) {
              await calendarButton.click();
              await page.waitForTimeout(2500);
            }
            const diagnostics = await page.evaluate(() => {
              const now=new Date();
              const key=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
              const today=document.querySelector('#fullCalendar .adapta-actual-today');
              const other=document.querySelector('#fullCalendar .adapta-other-month');
              const todayButton=[...document.querySelectorAll('#fullCalendar button')].find(b=>b.textContent.trim().toLowerCase()==='hoje')||null;
              return {
                browserNow:now.toString(),
                todayKey:key,
                patchStylePresent:!!document.getElementById('calendar-today-ux-v49'),
                patchRuntimePresent:!!document.getElementById('calendar-today-runtime-v49'),
                todayFound:!!today,
                todayDate:today?.getAttribute('data-date')||null,
                todayNumber:today?.querySelector('[role="link"]')?.textContent?.trim()||null,
                todayLabel:today?.querySelector('.adapta-today-label')?.textContent?.trim()||null,
                todayBackground:today?getComputedStyle(today).backgroundColor:null,
                todayBoxShadow:today?getComputedStyle(today).boxShadow:null,
                otherMonthFound:!!other,
                otherMonthDate:other?.getAttribute('data-date')||null,
                otherMonthOpacity:other?.firstElementChild?getComputedStyle(other.firstElementChild).opacity:null,
                todayButtonFound:!!todayButton,
                todayButtonDisabled:todayButton?.disabled??null,
                currentCellFound:!!document.querySelector(`#fullCalendar [role="gridcell"][data-date="${key}"]`)
              };
            });
            writeFileSync('live-check/status.json', JSON.stringify({ok:true,runId:process.env.GITHUB_RUN_ID,checkedAt:new Date().toISOString(),pageErrors,...diagnostics},null,2));
            await page.screenshot({path:'live-check/calendar-live.png',fullPage:true});
          } catch(e){
            writeFileSync('live-check/status.json',JSON.stringify({ok:false,runId:process.env.GITHUB_RUN_ID,checkedAt:new Date().toISOString(),pageErrors,error:String(e.stack||e)},null,2));
            await page.screenshot({path:'live-check/calendar-live.png',fullPage:true}).catch(()=>{});
          } finally { await browser.close(); }
          EOF

      - name: Upload live screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-adapta-live-check
          path: live-check/
          if-no-files-found: warn

      - name: Record live diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-check/status.json
          git commit -m "ci: record live calendar verification" || true
          git push
