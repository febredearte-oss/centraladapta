name: TEMP Verify Unified Central State
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-central-state-verify.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Wait for deploy
        run: sleep 30
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify central source of truth
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          await page.goto('https://centraladapta.febredearte.workers.dev',{waitUntil:'networkidle',timeout:60000});
          await page.waitForFunction(()=>document.documentElement.dataset.centralState==='ready',{timeout:30000});
          await page.waitForTimeout(1000);
          const result=await page.evaluate(async()=>{
            const r=await fetch('/api/shared-state',{cache:'no-store'});
            const remote=await r.json();
            const local=JSON.parse(localStorage.getItem('central_adapta_v40')||'null');
            const keys=['items','calendarEntries','editorialLines','lines','holidayRecords','holidayCommunicationTasks','holidayContents'];
            const counts={};
            for(const key of keys){
              const a=local?.[key]; const b=remote?.state?.[key];
              counts[key]={local:Array.isArray(a)?a.length:(a&&typeof a==='object'?Object.keys(a).length:null),remote:Array.isArray(b)?b.length:(b&&typeof b==='object'?Object.keys(b).length:null),same:JSON.stringify(a)===JSON.stringify(b)};
            }
            return {
              marker:!!document.getElementById('central-state-architecture-v4'),
              legacySharedMarker:!!document.querySelector('[id^="shared-state-sync-v"]'),
              centralReady:document.documentElement.dataset.centralState,
              gatewayReady:window.__adaptaCentralState?.ready?.()===true,
              revision:window.__adaptaCentralState?.getRevision?.()||0,
              remoteRevision:Number(remote?.revision||0),
              fullStateSame:JSON.stringify(local)===JSON.stringify(remote?.state),
              counts,
              holidayLegacyRuntime:!!document.getElementById('holiday-d1-persistence-v2')
            };
          });
          result.errors=errors;
          result.ok=result.marker&&result.centralReady==='ready'&&result.gatewayReady&&result.revision===result.remoteRevision&&result.fullStateSame&&!result.legacySharedMarker&&!result.holidayLegacyRuntime&&errors.length===0;
          writeFileSync('central-state-live.json',JSON.stringify(result,null,2));
          await browser.close();
          if(!result.ok){console.error(result);process.exit(1)}
          EOF
      - name: Record result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add central-state-live.json
          git commit -m "ci: record unified central state check" || true
          git push
