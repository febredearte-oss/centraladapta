name: TEMP Verify Unified Central State
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-central-state-verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Wait for deploy
        run: sleep 20
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose central state divergence
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          await page.goto('https://centraladapta.febredearte.workers.dev',{waitUntil:'networkidle',timeout:60000});
          await page.waitForFunction(()=>document.documentElement.dataset.centralState==='ready',{timeout:30000});
          await page.waitForTimeout(1200);
          const result=await page.evaluate(async()=>{
            const r=await fetch('/api/shared-state',{cache:'no-store'});
            const remote=(await r.json()).state;
            const local=JSON.parse(localStorage.getItem('central_adapta_v40')||'null');
            function diffs(a,b,path=[],out=[]){
              if(out.length>=80||JSON.stringify(a)===JSON.stringify(b))return out;
              if(Array.isArray(a)&&Array.isArray(b)){
                const n=Math.max(a.length,b.length);for(let i=0;i<n;i++)diffs(a[i],b[i],[...path,i],out);return out;
              }
              if(a&&b&&typeof a==='object'&&typeof b==='object'){
                const keys=new Set([...Object.keys(a),...Object.keys(b)]);for(const k of keys)diffs(a[k],b[k],[...path,k],out);return out;
              }
              out.push({path:path.join('.'),local:a,remote:b});return out;
            }
            return {
              calendar:diffs(local?.calendarEntries,remote?.calendarEntries).slice(0,40),
              holidayContents:diffs(local?.holidayContents,remote?.holidayContents).slice(0,40)
            };
          });
          console.log(JSON.stringify(result,null,2));
          await browser.close();
          EOF
