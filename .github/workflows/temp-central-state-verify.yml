name: TEMP Verify Unified Central State
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-central-state-verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: sleep 15
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Identify remaining divergence
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          await page.goto('https://centraladapta.febredearte.workers.dev',{waitUntil:'networkidle',timeout:60000});
          await page.waitForFunction(()=>document.documentElement.dataset.centralState==='ready',{timeout:30000});
          await page.waitForTimeout(1000);
          const result=await page.evaluate(async()=>{
            const remote=(await (await fetch('/api/shared-state',{cache:'no-store'})).json()).state;
            const local=JSON.parse(localStorage.getItem('central_adapta_v40')||'null');
            const canonical=window.__adaptaCentralState.canonical;
            const lc=canonical(local),rc=canonical(remote);
            const keys=[...new Set([...Object.keys(lc||{}),...Object.keys(rc||{})])];
            return keys.filter(k=>JSON.stringify(lc?.[k])!==JSON.stringify(rc?.[k])).map(k=>({key:k,local:lc?.[k],remote:rc?.[k]}));
          });
          console.log(JSON.stringify(result,null,2));
          await browser.close();
          EOF
