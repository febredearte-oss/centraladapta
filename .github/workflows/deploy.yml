name: Validate Central Adapta

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: centraladapta-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate worker syntax
        run: node --check src/worker-holiday-local-import.js

      - name: Build exactly as Cloudflare
        run: npx wrangler deploy --dry-run
