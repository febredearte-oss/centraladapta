name: Deploy Central Adapta

on:
  push:
    branches:
      - main
    paths-ignore:
      - deploy-status.json
  workflow_dispatch:

concurrency:
  group: centraladapta-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Repair v40 gzip chunk from exact stored prefix
        run: |
          python - <<'PY'
          from pathlib import Path
          exact_prefix = Path("approved/v40exact.part01.b64").read_text(encoding="utf-8").strip()
          original_chunk = Path("approved/v40.part01.b64").read_text(encoding="utf-8").strip()
          if len(exact_prefix) != 9000:
              raise SystemExit(f"prefixo exato inesperado: {len(exact_prefix)}")
          if len(original_chunk) != 18000:
              raise SystemExit(f"chunk base inesperado: {len(original_chunk)}")
          repaired = exact_prefix + original_chunk[len(exact_prefix):]
          Path("source/index.part01.b64").write_text(repaired, encoding="utf-8")
          print(f"chunk 1 recomposto: {len(repaired)} caracteres")
          PY

      - name: Validate exact uploaded v40
        run: node scripts/materialize-index.mjs

      - name: Deploy to Cloudflare Worker centraladapta
        id: deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: dca97af6a15592dde7c8119ef1f7ff94
          wranglerVersion: "4.40.0"
          command: deploy

      - name: Record deploy result
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          data = {
            "commit": os.environ.get("GITHUB_SHA"),
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "outcome": os.environ.get("DEPLOY_OUTCOME"),
            "deployment_url": os.environ.get("DEPLOYMENT_URL") or None,
            "checked_at": datetime.now(timezone.utc).isoformat(),
            "target": "https://centraladapta.febredearte.workers.dev",
            "expected_v40_sha256": "070251d0b7db5177262f50ef7b8b023f5d912d450bf18f309daa29855e758c11"
          }
          with open("deploy-status.json", "w", encoding="utf-8") as f:
            json.dump(data, f, ensure_ascii=False, indent=2)
            f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-status.json
          if [ "${DEPLOY_OUTCOME}" = "success" ]; then
            git add source/index.part01.b64
          fi
          git commit -m "ci: record deploy ${DEPLOY_OUTCOME}" || true
          git push

      - name: Fail if deployment failed
        if: steps.deploy.outcome != 'success'
        run: exit 1
