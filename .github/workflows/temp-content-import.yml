name: TEMP Import ADAPTA 20 Carrosseis

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-content-import.yml
      - scripts/temp-import-20-carrosseis.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Playwright library
        run: npm install --no-save playwright@1.55.0
      - name: Import and verify
        run: node scripts/temp-import-20-carrosseis.mjs
