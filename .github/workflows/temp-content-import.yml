name: TEMP Inspect Central Content Model

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-content-import.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright library
        run: npm install --no-save playwright@1.55.0
      - name: Inspect model
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          import { execSync } from 'node:child_process';
          const executablePath=execSync("command -v google-chrome || command -v google-chrome-stable || command -v chromium",{encoding:'utf8'}).trim();
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
          const page=await browser.newPage();
          await page.goto('https://centraladapta.febredearte.workers.dev',{waitUntil:'networkidle',timeout:60000});
          await page.waitForFunction(()=>document.documentElement.dataset.centralState==='ready',{timeout:30000});
          const out=await page.evaluate(async()=>{
            const remote=await (await fetch('/api/shared-state',{cache:'no-store'})).json();
            const s=remote.state||{};
            const summary={};
            for(const [k,v] of Object.entries(s)){
              if(Array.isArray(v)) summary[k]={type:'array',length:v.length,sample:v.slice(0,3)};
              else if(v&&typeof v==='object') summary[k]={type:'object',keys:Object.keys(v).length,sample:Object.entries(v).slice(0,3)};
              else summary[k]={type:typeof v,value:v};
            }
            return {revision:remote.revision,summary};
          });
          console.log(JSON.stringify(out,null,2));
          await browser.close();
          EOF
