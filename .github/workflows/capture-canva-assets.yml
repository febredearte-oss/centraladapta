name: Analyze Adapta Canva assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-canva-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install image tools
        run: python -m pip install --quiet pillow

      - name: Extract board palette and trim references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageChops
          from collections import Counter
          import json, colorsys
          from pathlib import Path

          root = Path('public/brand')
          board = Image.open(root/'adapta-logo-board.png').convert('RGBA')
          icon = Image.open(root/'adapta-brand-icon.png').convert('RGBA')

          def trim_white(im, out):
              rgb = im.convert('RGB')
              bg = Image.new('RGB', rgb.size, (255,255,255))
              diff = ImageChops.difference(rgb, bg).convert('L')
              diff = diff.point(lambda p: 255 if p > 12 else 0)
              box = diff.getbbox()
              cropped = im.crop(box) if box else im
              cropped.save(out)
              return box

          board_box = trim_white(board, root/'adapta-logo-board-trim.png')
          icon_box = trim_white(icon, root/'adapta-brand-icon-trim.png')

          sample = board.convert('RGB')
          sample.thumbnail((420,420))
          quant = sample.quantize(colors=32, method=Image.Quantize.MEDIANCUT).convert('RGB')
          counts = Counter(quant.getdata())

          colors=[]
          for (r,g,b), n in counts.most_common():
              mx, mn = max(r,g,b), min(r,g,b)
              # remove white/off-white backgrounds and nearly neutral greys
              if r>238 and g>238 and b>238: continue
              h,s,v = colorsys.rgb_to_hsv(r/255,g/255,b/255)
              if s < .10 and v > .55: continue
              hexc=f'#{r:02X}{g:02X}{b:02X}'
              # keep visually distinct entries
              if any(sum((a-c)**2 for a,c in zip((r,g,b), x['rgb'])) < 28**2 for x in colors):
                  continue
              colors.append({'hex':hexc,'rgb':[r,g,b],'pixels':n,'saturation':round(s,3),'value':round(v,3)})
              if len(colors)>=10: break

          data={
              'source':'Canva design DAHSSVFXI6w / Brand Kit ADAPTA-CANN',
              'board_size':list(board.size),
              'board_trim_box':board_box,
              'icon_size':list(icon.size),
              'icon_trim_box':icon_box,
              'dominant_non_neutral_colors':colors,
          }
          (root/'adapta-brand-data.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(data,ensure_ascii=False,indent=2))
          PY

      - name: Commit analysis
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/brand/adapta-brand-data.json public/brand/adapta-logo-board-trim.png public/brand/adapta-brand-icon-trim.png
          git commit -m 'assets: analyze official Adapta Canva palette' || exit 0
          git push
