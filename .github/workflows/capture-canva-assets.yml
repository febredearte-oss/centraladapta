name: Promote high-res Adapta logo board

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-canva-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Promote official high-resolution board
        run: |
          cp public/brand/adapta-logo-board-hires-trim.png public/brand/adapta-logo-board-trim.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/brand/adapta-logo-board-trim.png
          git commit -m 'assets: promote high-resolution Adapta logo board' || exit 0
          git push
