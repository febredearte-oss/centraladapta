name: Capture Adapta Canva assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-canva-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Capture official Canva references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/brand
          curl --fail --location --retry 3 \
            'https://media.canva.com/v2/document-image/hash:2015615283/height:376/id:DAHSSVFXI6w/type:B/width:668?brand=BADBwUSDO3A&csig=AAAAAAAAAAAAAAAAAAAAACgY3KLBJmQsv6xgrXFpNrCnpbo4XH2SUHeBLK2L0qwo&disableexport=T&exp=1787346436&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FFXI6w%2FDAHSSVFXI6w%2F11%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHYGFFNMW3%252F20260821%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260821T163509Z%26X-Amz-Expires%3D16327%26X-Amz-Signature%3De776fface09641b96d82d7a6bcb5ce2bfe48a93e9de4bcb75f2dcd8f22097444%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DFri%252C%252021%2520Aug%25202026%252021%253A07%253A16%2520GMT&fallbackstale=T&osig=AAAAAAAAAAAAAAAAAAAAAPUDpBHWsnBAKV7HWHXwAmkC1JBuQilpfDCPG4k7s5xK&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cfallbackstale%2Cpage%2Cversion&signer=document-rpc&version=12' \
            -o public/brand/adapta-logo-board.png
          curl --fail --location --retry 3 \
            'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F4101896b-d488-449f-bf77-1f481f3f456c/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAI45h-Z9pqDMTSdwvSWR_RV5TrBD0N5z7vRF_-9qm8V1&exp=1787360640&osig=AAAAAAAAAAAAAAAAAAAAACx6L07TRISR3ay6Cpc2nZfmXSHHicIwZwnDyFCJXR-5&signer=media-rpc&x-canva-quality=thumbnail' \
            -o public/brand/adapta-brand-icon.png
          file public/brand/*.png

      - name: Commit captured assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/brand/adapta-logo-board.png public/brand/adapta-brand-icon.png
          git commit -m 'assets: add official Adapta Canva references' || exit 0
          git push
