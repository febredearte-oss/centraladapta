name: TEMP Inspect Holiday Front

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-inspect-holiday-front.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Inspect exact persistence code
        run: |
          node scripts/materialize-index.mjs
          echo '=== STORAGE CONSTANTS / API ==='
          grep -n -E 'STORAGE_KEY|LEGACY_KEYS|/api/state|fetch\(' public/index.html | head -n 80 || true
          echo '=== SAVE PATCH ==='
          sed -n '5520,5685p' public/index.html
          echo '=== HOLIDAY LOCAL PERSIST ==='
          sed -n '4860,4905p' public/index.html
