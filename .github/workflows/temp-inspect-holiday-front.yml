name: TEMP Inspect Holiday Front

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-inspect-holiday-front.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Materialize frontend and inspect persistence
        run: |
          node scripts/materialize-index.mjs
          python - <<'PY'
          from pathlib import Path
          text=Path('public/index.html').read_text(errors='ignore')
          terms=['localStorage','sessionStorage','holidayRecords','holidayCommunicationTasks','holidayContents','holidays','/api/state','signature','assin','salvar','save']
          lines=text.splitlines()
          hits=[]
          for i,line in enumerate(lines):
            low=line.lower()
            if any(t.lower() in low for t in terms):
              start=max(0,i-2); end=min(len(lines),i+3)
              hits.append((i+1,'\n'.join(f'{j+1}: {lines[j]}' for j in range(start,end))))
          print('TOTAL_HITS',len(hits))
          for _,chunk in hits[:220]:
            print('---')
            print(chunk[:4000])
          PY
