name: TEMP Check Holiday Recovery
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-check-holiday-recovery.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Poll recovery status
        run: |
          set -e
          for i in $(seq 1 24); do
            code=$(curl -sS -o status.json -w '%{http_code}' --max-time 20 https://centraladapta.febredearte.workers.dev/__holiday-recovery-status-8f4d2c || true)
            if [ "$code" = "200" ]; then
              cat status.json
              exit 0
            fi
            sleep 5
          done
          echo "status endpoint did not become available" >&2
          exit 1
