name: TEMP Central Live Browser Recovery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Git deployment
        run: sleep 20
      - name: Install Playwright library
        run: npm install --no-save playwright@1.55.0
      - name: Verify live Central in system Chrome
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          import { execSync } from 'node:child_process';
          const executablePath=execSync("command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser",{encoding:'utf8'}).trim();
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[]; const consoleErrors=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          await page.goto('https://centraladapta.febredearte.workers.dev',{waitUntil:'networkidle',timeout:60000});
          await page.waitForFunction(()=>document.documentElement.dataset.centralState==='ready',{timeout:30000});
          await page.waitForTimeout(2000);
          const result=await page.evaluate(async()=>{
            const remote=await (await fetch('/api/shared-state',{cache:'no-store'})).json();
            const local=JSON.parse(localStorage.getItem('central_adapta_v40')||'{}');
            return {
              revision:remote.revision,
              remoteItems:remote.state?.items?Object.keys(remote.state.items).length:0,
              localItems:local.items&&typeof local.items==='object'?Object.keys(local.items).length:0,
              remoteEntries:Array.isArray(remote.state?.calendarEntries)?remote.state.calendarEntries.length:0,
              localEntries:Array.isArray(local.calendarEntries)?local.calendarEntries.length:0,
              remoteLines:Array.isArray(remote.state?.lines)?remote.state.lines.length:0,
              localLines:Array.isArray(local.lines)?local.lines.length:0,
              holidayRecords:Array.isArray(local.holidayRecords)?local.holidayRecords.length:0,
              stateReady:document.documentElement.dataset.centralState,
              mainStateDefined:typeof state==='object'&&!!state,
              calendarDefined:typeof fullCalendarInstance!=='undefined',
              overviewVisible:!!document.querySelector('#page-overview.page.active'),
              slotRuntime:!!document.getElementById('adapta-dynamic-slots-runtime-v2')
            };
          });
          result.pageErrors=errors;
          result.consoleErrors=consoleErrors;
          result.ok=result.stateReady==='ready'&&result.remoteItems===47&&result.localItems===47&&result.remoteEntries===64&&result.localEntries===64&&result.remoteLines===6&&result.localLines===6&&result.mainStateDefined&&result.slotRuntime&&errors.length===0;
          console.log(JSON.stringify(result,null,2));
          await browser.close();
          if(!result.ok) process.exit(1);
          EOF
