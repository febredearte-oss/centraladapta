name: TEMP Central Build Script Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Build exactly as Cloudflare
        run: npx wrangler deploy --dry-run
      - name: Check every generated inline script
        run: |
          python - <<'PY'
          import re, pathlib, subprocess, sys
          html=pathlib.Path('public/index.html').read_text()
          scripts=re.findall(r'<script([^>]*)>([\s\S]*?)</script>',html,re.I)
          bad=[]
          for i,(attrs,body) in enumerate(scripts):
              if re.search(r'\bsrc\s*=',attrs,re.I): continue
              sid=re.search(r'\bid=["\']([^"\']+)',attrs,re.I)
              name=sid.group(1) if sid else f'inline-{i}'
              pth=pathlib.Path(f'/tmp/script-{i}.js'); pth.write_text(body)
              p=subprocess.run(['node','--check',str(pth)],capture_output=True,text=True)
              if p.returncode: bad.append((i,name,p.stderr))
          print('INLINE_SCRIPTS',len(scripts))
          print('BROKEN',len(bad))
          for i,name,err in bad:
              print('\n###',i,name); print(err)
          if bad: sys.exit(1)
          PY
