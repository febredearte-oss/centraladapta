name: TEMP Central Script Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare deploy
        run: sleep 15
      - name: Find broken inline script
        run: |
          set -euo pipefail
          curl -fsS https://centraladapta.febredearte.workers.dev/ -o /tmp/central.html
          python - <<'PY'
          import re, pathlib, subprocess, sys
          html=pathlib.Path('/tmp/central.html').read_text()
          scripts=re.findall(r'<script([^>]*)>([\s\S]*?)</script>',html,re.I)
          bad=[]
          for i,(attrs,body) in enumerate(scripts):
              if re.search(r'\bsrc\s*=',attrs,re.I): continue
              sid=re.search(r'\bid=["\']([^"\']+)',attrs,re.I)
              name=sid.group(1) if sid else f'inline-{i}'
              path=pathlib.Path(f'/tmp/script-{i}.js')
              path.write_text(body)
              p=subprocess.run(['node','--check',str(path)],capture_output=True,text=True)
              if p.returncode:
                  bad.append((i,name,p.stderr))
          print('INLINE_SCRIPTS',len(scripts))
          print('BROKEN',len(bad))
          for i,name,err in bad:
              print('\n###',i,name)
              print(err)
          if bad: sys.exit(1)
          PY
