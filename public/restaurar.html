<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurar Central Adapta</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f4;color:#17231d;margin:0;padding:32px}main{max-width:640px;margin:10vh auto;background:#fff;border:1px solid #d8ded9;border-radius:18px;padding:32px;box-shadow:0 12px 40px rgba(0,0,0,.06)}h1{font-family:Georgia,serif;font-weight:400;margin-top:0}p{line-height:1.5}.box{border:1px dashed #9eb1a4;border-radius:12px;padding:18px;margin:20px 0}button{background:#1f5d46;color:#fff;border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:default}#status{margin-top:18px;padding:14px;border-radius:10px;background:#eef3ef}.ok{background:#e8f4ec!important}.err{background:#fff0f0!important;color:#8e2525}a{color:#1f5d46;font-weight:700}
</style>
</head>
<body>
<main>
<h1>Restaurar dados da Central</h1>
<p>Selecione o arquivo JSON da base da Central. A restauração só grava se o D1 ainda estiver vazio; um banco já inicializado não é sobrescrito.</p>
<div class="box"><input id="file" type="file" accept=".json,application/json"></div>
<button id="go">Restaurar no D1</button>
<div id="status">Aguardando o arquivo.</div>
</main>
<script>
const file=document.getElementById('file');
const btn=document.getElementById('go');
const status=document.getElementById('status');
btn.addEventListener('click',async()=>{
  if(!file.files[0]){status.className='err';status.textContent='Escolha o arquivo JSON primeiro.';return;}
  btn.disabled=true;status.className='';status.textContent='Lendo arquivo e enviando para o D1…';
  try{
    const text=await file.files[0].text();
    const state=JSON.parse(text);
    const r=await fetch('/api/bootstrap',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({state})});
    const data=await r.json().catch(()=>({}));
    if(r.ok || (r.status===409 && data.error==='already_initialized')){
      status.className='ok';
      status.innerHTML='Dados prontos no D1. <a href="/">Abrir a Central</a>';
      return;
    }
    throw new Error(data.error||('Falha HTTP '+r.status));
  }catch(e){status.className='err';status.textContent='Falha na restauração: '+e.message;btn.disabled=false;}
});
</script>
</body>
</html>
