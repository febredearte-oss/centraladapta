<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reparar Central Adapta</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f4;color:#17231d;margin:0;padding:32px}main{max-width:680px;margin:10vh auto;background:#fff;border:1px solid #d8ded9;border-radius:18px;padding:32px;box-shadow:0 12px 40px rgba(0,0,0,.06)}h1{font-family:Georgia,serif;font-weight:400;margin-top:0}p{line-height:1.5}.box{border:1px dashed #9eb1a4;border-radius:12px;padding:18px;margin:20px 0}button{background:#1f5d46;color:#fff;border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:default}#status{margin-top:18px;padding:14px;border-radius:10px;background:#eef3ef;line-height:1.45}.ok{background:#e8f4ec!important}.err{background:#fff0f0!important;color:#8e2525}a{color:#1f5d46;font-weight:700}
</style>
</head>
<body>
<main>
<h1>Reparar dados da Central</h1>
<p>Selecione a base JSON. Esta ferramenta <strong>preserva o que já entrou no calendário</strong> e recompõe apenas os dados ausentes, como conteúdos, linhas, feriados e guia visual.</p>
<div class="box"><input id="file" type="file" accept=".json,application/json"></div>
<button id="go">Reparar a Central</button>
<div id="status">Aguardando o arquivo.</div>
</main>
<script>
const file=document.getElementById('file');
const btn=document.getElementById('go');
const status=document.getElementById('status');

function byId(current=[], incoming=[]){
  const map=new Map();
  (incoming||[]).forEach(item=>item&&item.id&&map.set(item.id,item));
  (current||[]).forEach(item=>item&&item.id&&map.set(item.id,item));
  return [...map.values()];
}
function byKey(current=[], incoming=[], key='id'){
  const map=new Map();
  (incoming||[]).forEach((item,index)=>map.set(item?.[key]??`seed-${index}`,item));
  (current||[]).forEach((item,index)=>map.set(item?.[key]??`current-${index}`,item));
  return [...map.values()];
}
function mergeState(current, seed){
  const cur=current&&typeof current==='object'?current:{};
  const src=seed&&typeof seed==='object'?seed:{};
  const merged={...src,...cur};
  merged.contentCatalog=byId(cur.contentCatalog,src.contentCatalog);
  merged.lines=byId(cur.lines,src.lines);
  merged.holidays=byId(cur.holidays,src.holidays);
  merged.calendarEntries=byId(cur.calendarEntries,src.calendarEntries);
  merged.holidayContents=byId(cur.holidayContents,src.holidayContents);
  merged.holidayRecords=byKey(cur.holidayRecords,src.holidayRecords,'feriado_id');
  merged.holidayCommunicationTasks=byKey(cur.holidayCommunicationTasks,src.holidayCommunicationTasks,'id');
  merged.items={...(src.items||{}),...(cur.items||{})};
  merged.settings={...(src.settings||{}),...(cur.settings||{})};
  merged.activity=Array.isArray(cur.activity)&&cur.activity.length?cur.activity:(src.activity||[]);
  merged.visualGuideHtml=cur.visualGuideHtml||src.visualGuideHtml||'';
  merged.schemaVersion=Math.max(Number(src.schemaVersion||0),Number(cur.schemaVersion||0),2);
  return merged;
}

btn.addEventListener('click',async()=>{
  if(!file.files[0]){status.className='err';status.textContent='Escolha o arquivo JSON primeiro.';return;}
  btn.disabled=true;status.className='';status.textContent='Lendo a base e conferindo o D1…';
  try{
    const seed=JSON.parse(await file.files[0].text());
    const get=await fetch('/api/state',{cache:'no-store'});
    if(!get.ok)throw new Error('Não consegui ler o D1 ('+get.status+').');
    const remote=await get.json();
    const current=remote.state||{};
    const repaired=mergeState(current,seed);
    status.textContent=`Recompondo ${repaired.contentCatalog?.length||0} conteúdos e preservando ${repaired.calendarEntries?.length||0} entradas de calendário…`;
    const put=await fetch('/api/state',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({state:repaired,baseRevision:Number(remote.revision||0)})});
    const data=await put.json().catch(()=>({}));
    if(!put.ok)throw new Error(data.error||('Falha HTTP '+put.status));
    status.className='ok';
    status.innerHTML=`Reparo concluído. <strong>${repaired.contentCatalog?.length||0} conteúdos</strong> e <strong>${repaired.calendarEntries?.length||0} entradas de calendário</strong> estão no D1. <a href="/">Abrir a Central</a>`;
    btn.textContent='Central reparada';
  }catch(e){status.className='err';status.textContent='Falha no reparo: '+e.message;btn.disabled=false;btn.textContent='Tentar novamente';}
});
</script>
</body>
</html>
